<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You – Masram Group | Luxury Event Solutions</title>
  <meta name="description" content="Thank you for contacting Masram Group. We'll get back to you shortly regarding your event inquiry or booking request.">
  <meta name="keywords" content="thank you, Masram Group, contact confirmation, event booking confirmation">

  <!-- Favicon -->
  <link rel="icon" href="images/logo.webp">

  <!-- Google Fonts - Playfair Display + Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Specific styles for Thank You page to ensure perfect centering while using global design tokens */
    .thank-you-page {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .thank-you-page::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(198, 166, 100, 0.05) 0%, transparent 70%);
      z-index: 0;
    }

    .thank-you-container {
      max-width: 650px;
      background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-primary) 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2.5rem;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkmark-icon {
      font-size: 5rem;
      color: var(--emerald);
      margin-bottom: 1.5rem;
      text-shadow: var(--shadow-emerald);
      animation: popIn 0.6s ease;
    }

    @keyframes popIn {
      0%, 60% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .thank-you-container h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
      background: var(--gradient-gold-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .thank-you-container p {
      font-size: clamp(1.1rem, 2.5vw, 1.3rem);
      line-height: 1.8;
      margin-bottom: 2.5rem;
      color: var(--text-secondary);
    }

    .thank-you-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 48px;
      background: var(--gradient-gold);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-pill);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-gold);
      position: relative;
      overflow: hidden;
    }

    .thank-you-btn:hover {
      background: var(--gradient-emerald);
      color: var(--ivory);
      transform: translateY(-3px);
      box-shadow: var(--shadow-emerald);
    }

    @media (max-width: 480px) {
      .thank-you-container {
        padding: 2.5rem 1.5rem;
      }
      .checkmark-icon {
        font-size: 4rem;
      }
      .thank-you-btn {
        padding: 14px 40px;
        font-size: 0.95rem;
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="thank-you-page">

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-logo"></div>
  </div>

  <div class="thank-you-container fade-in">
    <div class="checkmark-icon">
      <i class="fas fa-check-circle"></i>
    </div>
    <h1>Thank You for Reaching Out!</h1>
    <p>We've received your message and will get back to you shortly regarding your inquiry.</p>
    <a href="index.html" class="thank-you-btn">
      <i class="fas fa-home"></i> Back to Home
    </a>
  </div>

  <!-- WhatsApp Floater -->
  <div class="whatsapp-floater">
    <a href="https://wa.me/27732910484" target="_blank" rel="noopener" class="whatsapp-btn" aria-label="Chat on WhatsApp">
      <i class="fab fa-whatsapp"></i>
      <span class="whatsapp-text">Chat with us</span>
    </a>
  </div>

</body>
</html>
